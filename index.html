<style>

.chip.on{background:var(--v);border-color:var(--v)}

.nb.on,.nb:hover{background:var(--card2);color:var(--t)}
.nb.on{box-shadow:inset 3px 0 var(--v)}
.bnav{display:none}
#main{overflow:auto;padding:22px 18px 40px}
.w{max-width:660px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:12px;align-items:center}

.av.big{width:84px;height:84px;font-size:32px}
.u{font-weight:700}.mu{color:var(--m);font-size:13px}
.pt{margin:12px 0;line-height:1.5;white-space:pre-wrap;word-break:break-word}

.ac{display:flex;gap:10px;margin-top:12px}

.ac button.on{color:#ff7aa8}
textarea.in{resize:none;min-height:70px}
.fl{padding:9px 14px;border-radius:99px;background:var(--card2);font-size:14px;cursor:pointer;color:var(--m)}
.sm{padding:9px 18px;border-radius:99px;background:var(--v);font-weight:700;font-size:14px}
.sm.g{background:var(--card2);color:var(--m)}
.cw{display:grid;grid-template-columns:300px 1fr;gap:14px;height:calc(100vh - 80px);max-width:960px;margin:auto}
.cl,.cb{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:auto}
.ci2{display:flex;gap:12px;align-items:center;padding:14px;cursor:pointer;border-bottom:1px solid var(--line)}
.ci2:hover,.ci2.on{background:var(--card2)}
.cb{display:flex;flex-direction:column}
.ch{padding:14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.ms{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}

.bb.me{align-self:flex-end;background:var(--v)}
.cs{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.cs .in{margin:0}
.bk{display:none;background:none;font-size:22px}
.st{display:flex;gap:26px;margin-top:14px}.st b{display:block;font-size:20px}

#app.on{grid-template-columns:1fr;grid-template-rows:1fr auto}

}

.m.off{opacity:.55}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}

.av{background:linear-gradient(135deg,#a24bff,#4f3bff,#e040fb)}

.box{box-shadow:0 0 70px #9333ff33}.card{box-shadow:0 8px 30px #0006}

.nb span{display:grid}.nb .ic{opacity:.65}.nb.on .ic,.nb:hover .ic{opacity:1;filter:drop-shadow(0 0 6px #c9a0ff)}
.nb.on{box-shadow:inset 3px 0 #c9a0ff,0 0 18px #9333ff44}
.fl{display:inline-flex;gap:8px;align-items:center}div.md{display:flex;gap:10px;align-items:center;justify-content:center}
.tk{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:34px;z-index:50;overflow:hidden;display:flex;align-items:center;background:rgba(10,4,24,.82);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);font-size:13px;font-weight:600;white-space:nowrap}

@keyframes tk{to{transform:translateX(-50%)}}
.ti{padding-right:30px}.ti b{margin-right:4px}.ti i{font-style:normal}

@keyframes rot{to{--a:360deg}}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.box,.card,.hero{position:relative}
.box::after,.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:conic-gradient(from var(--a),transparent 0 55%,#c9a0ff,#e040fb,#00c2ff,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:rot 6s linear infinite;pointer-events:none;opacity:.75}
.card{background:linear-gradient(160deg,#1c0e3af2,#0f0722f2);animation:in .5s cubic-bezier(.2,.8,.2,1) backwards;transition:transform .25s,box-shadow .25s}

.w>:nth-child(2){animation-delay:.07s}.w>:nth-child(3){animation-delay:.14s}.w>:nth-child(4){animation-delay:.21s}.w>:nth-child(n+5){animation-delay:.28s}

.spark{width:150px;flex:none}.spark path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:300;animation:draw 2.5s ease-out forwards}

.logo{background-image:linear-gradient(90deg,#fff,#c9a0ff,#e040fb,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.pri,.sm{transition:transform .15s,box-shadow .25s}.pri:hover,.sm:hover{box-shadow:0 0 28px #9333ffaa}.pri:active,.sm:active{transform:scale(.97)}
.av.big{box-shadow:0 0 0 3px #0008,0 0 0 5px #c9a0ff,0 0 30px #9333ff}
.cw{animation:in .5s backwards}
.tabs button.on{box-shadow:0 0 22px #9333ff77}
.pwrap{position:relative;margin-bottom:10px}.pwrap .in{margin-bottom:0;padding-right:48px}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;padding:8px;line-height:0}.eye .ic{opacity:.75}.eye:hover .ic{opacity:1}

.m.dg{color:#ff8fb0;border-color:#ea394366}
.cmw{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.cmt{padding:8px 0;border-bottom:1px solid #ffffff10;word-break:break-word}.cmt .lk{background:none;color:var(--m);font-size:12px;padding:2px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.tk{overflow-x:auto}}
</style>

<body>
<canvas id="cv"></canvas>

<section id="intro" class="scr on">
  <h1>ALMEX</h1>
  <p>Соцсеть трейдеров</p>
  <div class="coin"><div class="ci"><div class="cf">₿</div><div class="cf b">₿</div></div></div>
  <button id="go">Войти</button>
</section>

<section id="auth" class="scr f">
  <div class="box">
    <div class="logo">ALMEX</div>
    <h2>Вход в аккаунт</h2>
    <p class="s">Вход по почте и паролю. Аккаунты хранятся на защищённом сервере.</p>
    <div class="tabs"><button id="tL" class="on">Вход</button><button id="tR">Регистрация</button></div>
    <input class="in" id="id" placeholder="Почта" autocomplete="email">
    <div class="pwrap" id="w1"><input class="in" id="pw" type="password" placeholder="Пароль" autocomplete="current-password"><button type="button" class="eye" data-t="pw" aria-label="Показать пароль"></button></div>
    <div class="pwrap" id="w2" hidden><input class="in" id="pw2" type="password" placeholder="Повтори пароль" autocomplete="new-password"><button type="button" class="eye" data-t="pw2" aria-label="Показать пароль"></button></div>
    <div class="mu" id="hint" hidden style="margin-bottom:8px">Пароль: от 8 символов, буквы и цифры.</div>
    <div class="err" id="err"></div>
    <button class="pri" id="cont">Войти</button>
  </div>
</section>

<section id="setup" class="scr f">
  <div class="box">
    <div class="logo">ALMEX</div>
    <h2>Создай профиль</h2>
    <p class="s">Так тебя увидят другие трейдеры.</p>
    <input class="in" id="nm" placeholder="Имя" maxlength="30">
    <input class="in" id="un" placeholder="Никнейм, например alex_trade" maxlength="20">
    <input class="in" id="bio" placeholder="О себе в одной строке" maxlength="90">
    <div class="mu" style="margin-bottom:8px">Стиль торговли</div>
    <div class="chips" id="chips"></div>
    <div class="err" id="err2"></div>
    <button class="pri" id="mk">Создать аккаунт</button>
  </div>
</section>

<section id="app" class="scr">
  <aside class="side"><div class="logo">ALMEX</div><div id="sn"></div></aside>
  <main id="main"></main>
  <nav class="bnav" id="bn"></nav>
</section>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

let introOn=true;

async function report(kind,id,target){const r=await modal('Причина жалобы',['Спам','Мошенничество','Оскорбления','Неприемлемый контент','Другое'].map(x=>[x,x]));if(!r)return;

function setMode(m){mode=m;$('#tL').classList.toggle('on',m==='L');$('#tR').classList.toggle('on',m==='R');$('#w2').hidden=$('#hint').hidden=m==='L';
$('#cont').textContent=m==='L'?'Войти':'Создать аккаунт';$('#pw').autocomplete=m==='L'?'current-password':'new-password';$('#err').textContent=''}
$$('.eye').forEach(b=>{b.innerHTML=ic('eye');b.onclick=()=>{const i=$('#'+b.dataset.t),on=i.type==='password';i.type=on?'text':'password';b.innerHTML=ic(on?'eyeoff':'eye');b.setAttribute('aria-label',on?'Скрыть пароль':'Показать пароль')}});
$('#tL').onclick=()=>setMode('L');$('#tR').onclick=()=>setMode('R');
$('#cont').onclick=async()=>{const E=t=>$('#err').textContent=t;E('');
if(!sb)return E('Сервер не подключён: вставь ключи Supabase в index.html.');
const email=$('#id').value.trim().toLowerCase(),pw=$('#pw').value;
if(Date.now()<lockUntil)return E('Слишком много попыток. Подожди 30 секунд.');
if(!/^\S+@\S+\.\S+$/.test(email))return E('Введи корректную почту');
$('#cont').disabled=true;
try{let r;
if(mode==='R'){if(pw.length<8||!/[a-zA-Zа-яА-Я]/.test(pw)||!/\d/.test(pw))return E('Пароль: от 8 символов, буквы и цифры');
if(pw!==$('#pw2').value)return E('Пароли не совпадают');
r=await sb.auth.signUp({email,password:pw});if(r.error)return E(r.error.message);
if(!r.data.session)return E('Мы отправили письмо. Подтверди почту и войди.')}
else{r=await sb.auth.signInWithPassword({email,password:pw});if(r.error){if(++fails>=5){lockUntil=Date.now()+30000;fails=0}return E('Неверная почта или пароль')}fails=0}
uid=r.data.session.user.id;$('#pw').value=$('#pw2').value='';await enter()}
catch(e){E('Нет связи с сервером. Проверь интернет.')}finally{$('#cont').disabled=false}};
async function enter(){const{data,error:pe}=await sb.from('profiles').select('*').eq('id',uid).maybeSingle();
if(pe){show('auth');$('#err').textContent='Ошибка загрузки профиля: '+pe.message;return}
if(!data)return show('setup');me=data;const f=await sb.from('follows').select('following').eq('follower',uid);follow=new Set((f.data||[]).map(r=>r.following));show('app');go('feed')}
$('#go').onclick=()=>uid?enter():show('auth');

$$('#chips .chip').forEach(b=>b.onclick=()=>{const k=b.textContent;sel.has(k)?sel.delete(k):sel.add(k);b.classList.toggle('on')});

posts.forEach(p=>{p.liked=s.has(p.id);p.lc=p.likes?.[0]?.count||0;p.cc=p.comments?.[0]?.count||0})}}
async function loadBlocks(){const{data}=await sb.rpc('my_blocks');blocks=data||[]}
async function loadCmts(id){const{data}=await sb.from('comments').select('id,body,created,user_id,profiles(username,name,avatar)').eq('post_id',id).order('created').limit(100);cmts=data||[]}

async function loadPeople(){if(!$('#plist'))return;let q=sb.from('profiles').select('id,username,name,bio,avatar').neq('id',uid).order('created',{ascending:false}).limit(30);
const t=($('#fs')?.value||'').trim().replace(/[%,()*@]/g,'');if(t)q=q.or(`username.ilike.%${t}%,name.ilike.%${t}%`);
const{data}=await q;const el=$('#plist');if(!el)return;people=data||[];
el.innerHTML=people.length?people.map(p=>`<div class="card row">${av(p.name,'',p.avatar)}<div style="flex:1;min-width:0"><div class="u">${esc(p.name)}</div><div class="mu">@${esc(p.username)}${p.bio?' · '+esc(p.bio):''}</div></div><button class="sm ${follow.has(p.id)?'g':''}" data-a="fol" data-i="${p.id}">${follow.has(p.id)?'Вы подписаны':'Подписаться'}</button><button class="sm g" data-a="pmenu" data-i="${p.id}" aria-label="Ещё">⋯</button></div>`).join(''):'<div class="card mu">Никого не нашли. Позови друга в ALMEX!</div>'}

const m=$('#ms');if(!data||!m||cur==null||friends[cur].id!==p||data.length===msgs.length)return;msgs=data;
m.innerHTML=msgs.map(x=>`<div class="bb ${x.from_id===uid?'me':''}">${esc(x.body)}</div>`).join('');m.scrollTop=m.scrollHeight}

pend=null;await loadFeed();render()},
async pdel(i){await sb.from('posts').delete().eq('id',i).eq('user_id',uid);await loadFeed();render()},
async like(i){const p=posts.find(x=>x.id==i);if(!p)return;const r=p.liked?await sb.from('likes').delete().eq('post_id',p.id).eq('user_id',uid):await sb.from('likes').insert({post_id:p.id,user_id:uid});
if(r.error)return;p.liked=!p.liked;p.lc+=p.liked?1:-1;render()},
async cm(i){i=+i;if(openC===i){openC=null;render();return}openC=i;cmts=[];await loadCmts(i);render()},
async csend(i){const x=$('#cmi').value.trim();if(!x)return;const{error}=await sb.from('comments').insert({post_id:+i,user_id:uid,body:x});
if(error){$('#cmi').value='';$('#cmi').placeholder='Не удалось отправить';return}const p=posts.find(q=>q.id==i);if(p)p.cc++;await loadCmts(+i);render()},
async cmenu(i){const c=cmts.find(x=>x.id==i);if(!c)return;
if(c.user_id===uid){const r=await modal('Удалить комментарий?',[['Удалить','d',1]]);if(r){await sb.from('comments').delete().eq('id',c.id);await loadCmts(openC);render()}}
else await report('comment',c.id,c.user_id)},
async menu(i){const p=posts.find(x=>x.id==i);if(!p)return;
if(p.user_id===uid){const r=await modal('Удалить пост?',[['Удалить','d',1]]);if(r)A_.pdel(p.id);return}
const r=await modal('Что сделать с постом?',[['Пожаловаться','r'],['Заблокировать автора','b',1]]);
if(r&&r.v==='r')await report('post',p.id,p.user_id);if(r&&r.v==='b')await block(p.user_id,(p.profiles||{}).name)},
async pmenu(i){const p=people.find(x=>x.id===i);if(!p)return;
const r=await modal(esc(p.name),[['Пожаловаться на аккаунт','r'],['Заблокировать','b',1]]);
if(r&&r.v==='r')await report('user',p.id,p.id);if(r&&r.v==='b')await block(p.id,p.name)},
async unblock(i){await sb.from('blocks').delete().eq('blocker',uid).eq('blocked',i);await loadBlocks();render()},
async pw(){const r=await modal('Новый пароль',[['Сохранить','s']],'Минимум 8 символов, буквы и цифры');if(!r)return;const p=r.t;
if(p.length<8||!/[a-zA-Zа-яА-Я]/.test(p)||!/\d/.test(p)){$('#eok').textContent='Пароль слабый: от 8 символов, буквы и цифры';return}
const{error}=await sb.auth.updateUser({password:p});$('#eok').textContent=error?'Не удалось сменить пароль':'Пароль изменён'},
async outall(){await sb.auth.signOut({scope:'global'});location.reload()},
async delacc(){const r=await modal('Удалить аккаунт навсегда? Посты, сообщения и журнал сделок исчезнут. Введи УДАЛИТЬ.',[['Удалить аккаунт','d',1]],'УДАЛИТЬ');
if(!r||r.t.trim().toUpperCase()!=='УДАЛИТЬ')return;const{error}=await sb.rpc('delete_my_account');
if(error){$('#eok').textContent='Не удалось удалить аккаунт';return}await sb.auth.signOut();location.reload()},
fm(i){feedMode=i;go('feed')},
async fol(i){const on=follow.has(i),r=on?await sb.from('follows').delete().eq('follower',uid).eq('following',i):await sb.from('follows').insert({follower:uid,following:i});
if(r.error)return;on?follow.delete(i):follow.add(i);loadPeople()},
chat(i){cur=+i;render();clearInterval(poll);poll=setInterval(loadMsgs,3000)},
back(){cur=null;clearInterval(poll);render()},
async send(){const i=$('#cin').value.trim();if(!i||cur==null)return;$('#cin').value='';
await sb.from('messages').insert({from_id:uid,to_id:friends[cur].id,body:i});msgs=[];loadMsgs()},
dir(i){jdir=i;$$('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.i===i))},
async jadd(){const g=id=>$(id).value,n=id=>g(id)===''?'':+g(id),sym=g('#jsym').trim().toUpperCase();
if(!sym)return $('#jerr').textContent='Укажи инструмент';
const e={sym,tf:g('#jtf'),dir:jdir,en:n('#jen'),sl:n('#jsl'),tp:n('#jtp'),rk:n('#jrk'),res:n('#jrs'),why:g('#jwhy').trim(),ex:g('#jex'),nt:g('#jnt').trim(),d:Date.now()};
const{error}=await sb.from('trades').insert({user_id:uid,data:e});if(error)return $('#jerr').textContent='Не удалось сохранить';await loadTrades();render()},
async jdel(i){await sb.from('trades').delete().eq('id',i);await loadTrades();render()},
est(i){me.styles=me.styles||[];const k=me.styles.indexOf(i);k<0?me.styles.push(i):me.styles.splice(k,1);$$('#ech .chip').forEach(b=>b.classList.toggle('on',me.styles.includes(b.dataset.i)))},
async psave(){const n=$('#enm').value.trim(),o=$('#eok');if(!n){o.textContent='Имя не может быть пустым';return}
me.name=n;me.bio=$('#ebio').value.trim();const{error}=await sb.from('profiles').update({name:me.name,bio:me.bio,styles:me.styles||[]}).eq('id',uid);
o.textContent=error?'Не удалось сохранить':'Сохранено'},
invite(){try{navigator.clipboard.writeText(location.href.split('#')[0]);$('#eok').textContent='Ссылка скопирована. Отправь её другу.'}catch(e){$('#eok').textContent=location.href}},
async out(){await sb.auth.signOut();location.reload()}};
$('#main').onclick=e=>{const b=e.target.closest('[data-a]');if(b)A_[b.dataset.a](b.dataset.i)};
$('#main').onchange=async e=>{const t=e.target,f=t.files&&t.files[0];if(!f)return;
if(t.id==='pf'){pend=await resize(f,900,.72);$('#pn').textContent='Фото добавлено'}
if(t.id==='pph'){me.avatar=await resize(f,256,.85);await sb.from('profiles').update({avatar:me.avatar}).eq('id',uid);render()}};
let dt;$('#main').oninput=e=>{if(e.target.id==='fs'){clearTimeout(dt);dt=setTimeout(loadPeople,300)}};
$('#main').onkeydown=e=>{if(e.key==='Enter'&&e.target.id==='cin')A_.send();if(e.key==='Enter'&&e.target.id==='cmi')A_.csend(openC)};

</script>
</body>
</html>
